<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oliveira's Pets - Remover Animal</title>
  <link rel="stylesheet" href="../../css/styleTelaRemoverAnimal.css" />
</head>
<body>

  <div class="sidebar">
    <h1>Oliveira’s Pets</h1>
    <ul>
      <li> Produtos</li>
      <li> Animais</li>
      <li> Agenda</li>
      <li> Historico</li>
    </ul>
  </div>

  <div class="main">
    <div class="form-box">
      <div class="form-header">Remover Animal</div>
  <form id="form-removerAnimal">
    <div class="form-grid">
      <input id="nomeAnimal" type="text" placeholder="Nome" />
      <input id="cpfDono" type="text" OnKeyPress="formatar('###.###.###-##',this)" maxlength="14" minlength="14" placeholder="CPF" />
    </div>
    <button type="submit" class="btn-submit">Remover</button>
  </form>
  <button onClick="window.location.href='../telaAnimais'"class="btn-voltar">Voltar</button>
</div>
<script src="../../script/Animal/DeletarAnimal.js"></script>
</body>
</html>
