<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oliveira's Pets - Remover Produtos</title>
  <link rel="stylesheet" href="../../css/styleTelaRemoverProduto.css"/>
</head>
<body>

  <div class="sidebar">
    <h1>Oliveira’s Pets</h1>
    <ul>
      <li onclick="window.location.href='../telaProdutos'"> Produtos</li>
      <li onclick="window.location.href='../telaAnimais'"> Animais</li>
      <li onclick="window.location.href='../telaAgenda'"> Agenda</li>
      <li onclick="window.location.href='../telaHistorico'"> Historico</li>
    </ul>
  </div>

  <div class="main">
    <div class="form-box">
      <div class="form-header remover">Remover Produto</div>
      <form id="form-removerProduto">
        <input id = 'codigoEAN' maxlength='5' type="text" placeholder="Código do Produto" />
        <button type="submit" class="btn-remove">Remover</button>
      </form>

      <button onClick="window.location.href='../telaProdutos'"class="btn-voltar">Voltar</button>
    </div>
  </div>
  <script src="../../script/Produto/removerProduto.js"></script>
</body>
</html>
