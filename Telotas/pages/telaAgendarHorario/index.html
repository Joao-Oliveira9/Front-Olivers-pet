<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oliveira's Pets - Agendamento</title>
  <link rel="stylesheet" href="../../css/styleTelaAgendarHorario.css" />
</head>
<body>

  <div class="sidebar">
    <h1>Oliveira’s Pets</h1>
    <ul>
      <li> Produtos</li>
      <li> Animais</li>
      <li> Agenda</li>
      <li> Historico</li>
    </ul>
  </div>

  <div class="main">
    <div class="form-box">
      <div class="form-header">Agendamento</div>
  <form id="form-agendarHorario">
    <div class="form-grid">
      <input id="nome" type="text" placeholder="Nome Pet" />
      <select id="servicos">
        <option disabled selected>Serviços</option>
      </select>
      <input id="cpf" type="text" OnKeyPress="formatar('###.###.###-##',this)" maxlength="14" minlength="14" placeholder="CPF" />
      <input id="data" OnKeyPress="formatar('####-##-##',this)" maxlength="10" minlength="10" type="text" placeholder="Data (Ano-Mês-Dia)" />
      <select id="funcionarios">
        <option disabled selected>Funcionário Responsável</option>
      </select>
      <select id="horarios">
        <option disabled selected>Horarios</option>
        <option value="09:00">09:00</option>
        <option value="10:00">10:00</option>
        <option value="11:00">11:00</option>
        <option value="13:00">13:00</option>
        <option value="14:00">14:00</option>
        <option value="15:00">15:00</option>
        <option value="16:00">16:00</option>
        <option value="17:00">17:00</option>
      </select>
    </div>
    <button type="submit" class="btn-submit">Agendar</button>
    <button onClick="window.location.href='../telaAgenda'" class="btn-voltar">Voltar</button>
  </form>
</div>
<script src="../../script/Agendamento/AgendarHorario.js"></script>
</body>
</html>
