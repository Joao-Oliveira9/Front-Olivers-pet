<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oliveira's Pets - Agendamento</title>
  <link rel="stylesheet" href="../../css/styleTelaAgendarHorario.css" />
</head>
<body>

  <div class="sidebar">
    <h1>Oliveira’s Pets</h1>

      <li>Produtos</li>
      <li>Clientes</li>

      <li>Agenda</li>

      <input type="text" placeholder="Nome Pet" />

        <option disabled selected>Serviço</option>
      </select>
      <input type="text" placeholder="Telefone" />
      <input type="text" placeholder="Data" />

        <option disabled selected>Funcionário Responsável</option>
      </select>
    </div>
    <button type="submit" class="btn-submit">Agendar</button>
  </form>
</div>

</body>
</html>
