<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oliveira's Pets - Agendamento</title>
  <link rel="stylesheet" href="../../css/styleTelaEditarHorario.css"/>
</head>
<body>

  <div class="sidebar">
    <h1>Oliveira’s Pets</h1>
    <ul>
      <li>Produtos</li>
      <li>Clientes</li>
      <li>Animais</li>
      <li>Agenda</li>
    </ul>
  </div>

  <div class="main">
    <div class="form-box">
      <div class="form-header">Agendamento</div>
  <form>
    <div class="form-grid">
      <input id="nome_pet" type="text" placeholder="Nome Pet" disabled/>
      <select id="servicos">
        <option disabled selected>Serviço</option>
      </select>
      <input id="telefone" type="text" placeholder="Telefone" disabled/>
      <input id="data" OnKeyPress="formatar('####-##-##',this)" maxlength="10" minlength="10" type="text" placeholder="Data" />
      <select id="horarios">
        <option disabled selected>Horarios</option>
        <option value="09:00">09:00</option>
        <option value="10:00">10:00</option>
        <option value="11:00">11:00</option>
        <option value="13:00">13:00</option>
        <option value="14:00">14:00</option>
        <option value="15:00">15:00</option>
        <option value="16:00">16:00</option>
        <option value="17:00">17:00</option>
      </select>
      <select id="funcionarios">
        <option disabled selected>Funcionário Responsável</option>
      </select>
    </div>
    <button type="submit" class="btn-submit">Editar</button>
    <p class="warning">*Campos deixados em branco não serão alterados</p>
  </form>
</div>

</body>
</html>
