<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oliveira's Pets - Agendamento</title>
  <link rel="stylesheet" href="../../css/styleTelaEditarHorario.css"/>
</head>
<body>

  <div class="sidebar">
    <h1>Oliveira’s Pets</h1>
    <ul>
      <li> Produtos</li>
      <li> Animais</li>
      <li> Agenda</li>
      <li> Historico</li>
    </ul>
  </div>

  <div class="main">
    <div class="form-box">
      <div class="form-header">Agendamento</div>
  <form>
    <div class="form-grid">
      <input type="text" placeholder="Nome Pet" />
      <select>
        <option disabled selected>Serviço</option>
      </select>
      <input type="text" placeholder="Telefone" />
      <input type="text" placeholder="Data" />
      <select>
        <option disabled selected>Funcionário Responsável</option>
      </select>
    </div>
    <button type="submit" class="btn-submit">Editar</button>
    <p class="warning">*Campos deixados em branco não serão alterados</p>
  </form>
</div>

</body>
</html>
