<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oliveira's Pets - Cadastro de Produto</title>
  <link rel="stylesheet" href="../../css/styleTelaCadastroProduto.css" />
</head>
<body>
  <div class="sidebar">
    <h1>Oliveira’s Pets</h1>
    <ul>
      <li onclick="window.location.href='../telaProdutos'"> Produtos</li>
      <li onclick="window.location.href='../telaAnimais'"> Animais</li>
      <li onclick="window.location.href='../telaAgenda'"> Agenda</li>
      <li onclick="window.location.href='../telaHistorico'"> Historico</li>
    </ul>
  </div>

  <div class="main">
    <div class="form-box">
      <div class="form-header">Cadastrar Produto</div>
      <form id="form-cadastroProdutos">
        <div class="form-grid">
          <input id='codigoEAN' maxlength='5' type="text" placeholder="Código" />
          <select id="funcionarios">
            <option value=""> Funcionario</option>
          </select>
          <input id='qtdVendida' type="number" placeholder="Qtd Vendida" />
        </div>
        <button type="submit" class="btn-submit">Cadastrar</button>
        
      </form>
      <button onClick="window.location.href='../telaHistorico'"class="btn-voltar">Voltar</button>
    </div>
  </div>
  <script src="../../script/Historico/adicionarProdutoVendido.js"></script>
</body>
</html>
