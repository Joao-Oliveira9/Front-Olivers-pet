<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oliveira's Pets - Editar Animal</title>
  <link rel="stylesheet" href="../../css/styleTelaEditarAnimal.css" />
</head>
<body>

  <div class="sidebar">
    <h1>Oliveira’s Pets</h1>
    <ul>
      <li>Produtos</li>
      <li>Clientes</li>
      <li>Animais</li>
      <li>Agenda</li>
    </ul>
  </div>

  <div class="main">
    <div class="form-box">
      <div class="form-header">Editar Animal</div>
  <form>
    <div class="form-grid">
      <input type="text" placeholder="Nome" />
      <select>
        <option disabled selected>Tipo</option>
      </select>
      <input type="text" placeholder="Idade" />
      <input type="text" placeholder="Porte" />
      <input type="text" placeholder="CPF" />
    </div>
    <button type="submit" class="btn-submit">Editar</button>
    <p class="warning">*Campos deixados em branco não serão alterados</p>
  </form>
</div>

</body>
</html>
