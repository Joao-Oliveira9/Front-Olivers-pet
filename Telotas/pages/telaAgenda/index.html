<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oliveira's Pets - Agenda</title>
  <link rel="stylesheet" href="../../css/styleTelaAgenda.css" />
</head>
<body>

  <div class="sidebar">
    <h1>Oliveira’s Pets</h1>
    <ul>
      <li onclick="window.location.href='../telaProdutos'"> Produtos</li>
      <li onclick="window.location.href='../telaAnimais'"> Animais</li>
      <li onclick="window.location.href='../telaAgenda'"> Agenda</li>
      <li onclick="window.location.href='../telaHistorico'"> Historico</li>
    </ul>
  </div>

  <div class="main">
    <div class="actions">
      <div>
        <button onClick = 'window.location.href="../telaAgendarHorario"' class="btn-add">Agendar Horário</button>
        <button onClick = 'window.location.href="../telaRemoverAgenda"'class="btn-remove">Cancelar Agenda</button>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Data</th>
            <th>Funcionário</th>
            <th>Serviço</th>
            <th>Telefone</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="agendamentos-tbody">
          <!-- Tabelota -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="../../script/Agendamento/MostrarAgendamentos.js"></script>

</body>
</html>
